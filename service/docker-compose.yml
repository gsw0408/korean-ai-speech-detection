services:
  service:
    build: .
    image: nii-speech:local
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ACTIVE_BUNDLE: ${ACTIVE_BUNDLE:-bundles/nii-small-v1}
      ONNX_THREADS: ${ONNX_THREADS:-4}
      ANALYSIS_CONCURRENCY: ${ANALYSIS_CONCURRENCY:-1}
    tmpfs:
      - /tmp/uploads:rw,nosuid,noexec,size=512m,uid=10001,gid=10001,mode=0700
    volumes:
      - donations:/data/donations
    cpus: 4
    mem_limit: 2500m
    restart: unless-stopped
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  donations:
